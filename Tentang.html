<!DOCTYPE html>
<html>
<head>
  <title>My Love ❤️</title>

  <style>
   
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --gold: #d6b46a;
  --cream: #f4e4c1;
  --maroon: #300914;
}

body {
  background: radial-gradient(ellipse, #641d32, #300914 75%);
  color: #f4e4c1;
  font-family: 'Montserrat', sans-serif;
  overflow-x: hidden;
}

/* BUTTON CONTAINER */
.button-container {
  text-align: center;
  width: 100%;
  max-width: 520px;
  min-height: 100vh;
  margin: 0 auto;
  padding: 25px 22px;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  color: var(--cream);
}

/* JUDUL */
.button-container h2 {
  color: var(--gold);
  font-family: 'Cormorant Garamond', serif;
  font-size: 32px;
  margin-bottom: 12px;
}

.button-container p {
  font-size: 14px;
  margin-bottom: 30px;
  line-height: 1.8;
}

/* AREA TOMBOL */
.button-area {
  position: relative;
  width: 100%;
  max-width: 440px;
  height: 240px;

  border: 1px solid var(--gold);
  border-radius: 18px;

  background: rgba(255,255,255,0.025);
  overflow: hidden;
}

/* KEDUA TOMBOL */
#buttonA,
#buttonB {
  position: absolute;
  padding: 13px 23px;
  border-radius: 30px;
  font-size: 13px;
  font-family: 'Montserrat', sans-serif;
  cursor: pointer;
  white-space: nowrap;
  transition: left 0.2s ease, top 0.2s ease;
}

/* TOMBOL TIDAK MAU */
#buttonA {
  background: var(--maroon);
  color: var(--cream);
  border: 1px solid var(--gold);
  left: 15px;
  top: 15px;
}

/* TOMBOL MAU */
#buttonB {
  background: var(--gold);
  color: var(--maroon);
  border: none;
  right: 15px;
  bottom: 15px;
}

/* RESPONSIVE IPHONE */
@media (max-width: 480px) {
  .button-container h2 {
    font-size: 29px;
  }

  .button-area {
    height: 220px;
  }
}

  </style>
</head>

<body>

  
  <div class="button-container">
    <h2>Do You Love Me? ❤️</h2>

    <div class="button-area">
      <button id="buttonA">TIDAK MAU 🙈</button>
      <button id="buttonB">MAU ❤️</button>
    </div>
  </div>

  
  <script>
  const buttonA = document.getElementById("buttonA");
const buttonB = document.getElementById("buttonB");
const buttonArea = document.querySelector(".button-area");

// Tombol A berpindah tempat
buttonA.addEventListener("click", function() {

  const maxX = buttonArea.clientWidth - buttonA.offsetWidth;
  const maxY = buttonArea.clientHeight - buttonA.offsetHeight;

  const randomX = Math.random() * maxX;
  const randomY = Math.random() * maxY;

  buttonA.style.left = randomX + "px";
  buttonA.style.top = randomY + "px";

});

// Tombol B membuka surprise.html
buttonB.addEventListener("click", function() {
  window.location.href = "surprise.html";
});
  </script>

</body>
</html>
