<!DOCTYPE html>
<html>
<head>
  <title>My Love ❤️</title>

  <style>
   
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --gold: #d6b46a;
  --cream: #f4e4c1;
  --maroon: #300914;
}

body {
  background: radial-gradient(ellipse, #641d32, #300914 75%);
  color: #f4e4c1;
  font-family: 'Montserrat', sans-serif;
  overflow-x: hidden;
}

    #page2 {
  min-height: 100vh;
  min-height: 100dvh;
  padding: 50px 25px;
  text-align: center;
  color: var(--cream);
}

#page2 h2 {
  color: var(--gold);
  font-family: 'Cormorant Garamond', serif;
  font-size: 47px;
  margin-bottom: 25px;
}

/* CONTAINER UTAMA */
.button-container {
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0;
  padding: 25px 0 0;

  display: flex;
  flex-direction: column;
  align-items: center;

  text-align: center;
  color: var(--cream);
}

/* JUDUL */
.button-container h2 {
  width: 100%;
  color: var(--gold);
  font-family: 'Cormorant Garamond', serif;
  font-size: 47px;
  margin-bottom: 25px;
}


/* AREA TOMBOL */
.button-area {
  position: relative;
  width: 100%;
  height: calc(100dvh - 120px);
  overflow: hidden;
}

/* KEDUA TOMBOL */
#buttonA,
#buttonB {
  position: absolute;
  top: 35px;

  width: 145px;
  height: 55px;
  padding: 0;

  display: flex;
  justify-content: center;
  align-items: center;

  border-radius: 50px;
  font-size: 13px;
  font-family: 'Montserrat', sans-serif;
  white-space: nowrap;
  cursor: pointer;

  transition: left 0.2s ease, top 0.2s ease;
}

/* TIDAK MAU - KANAN */
#buttonA {
  left: calc(50% + 25px);
  background: var(--gold);
  color: var(--maroon);
  border: 1px solid var(--gold);
}

/* SAYANG - KIRI */
#buttonB {
  left: calc(50% - 150px);
  background: var(--gold);
  color: var(--maroon);
  border: 1px solid var(--gold);
}


/* IPHONE */
@media (max-width: 480px) {
  #buttonA,
  #buttonB {
    font-size: 14px;
    padding: 13px 19px;
  }
}


  #buttonA,
  #buttonB {
    font-size: 25px;
    padding: 15px 20px;
  }
}
    /* DECORATION */

.decor {
 position: fixed;
 pointer-events: none;
 color: #d99aae;
 opacity: .35;
 z-index: 0;
}

.decor.one {
 top: 12%;
 left: 5%;
 font-size: 30px;
}

.decor.two {
 top: 35%;
 right: 6%;
 font-size: 25px;
}

.decor.three {
 bottom: 12%;
 left: 8%;
 font-size: 22px;
}

  </style>
</head>

<body>

  
  <div id="page1" class="button-container">
    <h2>Mas kan sayang ade<br>
      Apakah ade sayang mas juga? ❤️</h2>

    <div class="button-area">
      <button id="buttonB">SAYANG❤️</button>
      <button id="buttonA">NGGA!!!</button>
    </div>
  </div>

  <div id="page2" style="display:none">

  <h2>YEAYYY ❤️</h2>

  <p>
    Mas tahu ade sayang mas juga.
    Terima kasih sudah memilih mas. ❤️
  </p>

</div>

  
  <script>
  const buttonA = document.getElementById("buttonA");
const buttonB = document.getElementById("buttonB");
const buttonArea = document.querySelector(".button-area");

// Tombol A berpindah tempat
buttonA.addEventListener("click", function() {

  const maxX = buttonArea.clientWidth - buttonA.offsetWidth;
  const maxY = buttonArea.clientHeight - buttonA.offsetHeight;

  const randomX = Math.random() * maxX;
  const randomY = Math.random() * maxY;

  buttonA.style.left = randomX + "px";
  buttonA.style.top = randomY + "px";

});

// Tombol B membuka surprise.html
buttonB.addEventListener("click", function() {
  document.getElementById("page1").style.display = "none";

  document.getElementById("page2").style.display = "block";

});
  </script>

</body>
</html>
