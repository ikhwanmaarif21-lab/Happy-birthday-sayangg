<!DOCTYPE html>
<html>
<head>
  <title>My Love ❤️</title>

  <style>
   
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --gold: #d6b46a;
  --cream: #f4e4c1;
  --maroon: #300914;
}

body {
  background: radial-gradient(ellipse, #641d32, #300914 75%);
  color: #f4e4c1;
  font-family: 'Montserrat', sans-serif;
  overflow-x: hidden;
}


/* CONTAINER UTAMA */
.button-container {
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0;
  padding: 25px 0 0;

  display: flex;
  flex-direction: column;
  align-items: center;

  text-align: center;
  color: var(--cream);
}

/* JUDUL */
.button-container h2 {
  width: 100%;
  color: var(--gold);
  font-family: 'Cormorant Garamond', serif;
  font-size: 42px;
  margin-bottom: 25px;
}

/* AREA TOMBOL FULL SCREEN */
.button-area {
  position: relative;
  width: 100%;
  height: calc(100dvh - 120px);
  min-height: 500px;

  border-top: 1px solid var(--gold);
  border-bottom: 1px solid var(--gold);
  border-left: none;
  border-right: none;

  border-radius: 0;
  overflow: hidden;

  background: rgba(255,255,255,0.025);
}

/* KEDUA TOMBOL */
#buttonA,
#buttonB {
  position: absolute;
  top: 42px;

  padding: 17px 28px;
  border-radius: 40px;
  font-size: 16px;
  font-family: 'Montserrat', sans-serif;

  white-space: nowrap;
  cursor: pointer;

  transition: left 0.2s ease, top 0.2s ease;
}

/* TIDAK MAU */
#buttonA {
  left: 34%;
  background: transparent;
  color: var(--cream);
  border: 1px solid var(--gold);
}

/* MAU */
#buttonB {
  left: 56%;
  background: var(--gold);
  color: var(--maroon);
  border: 1px solid var(--gold);
}

/* IPHONE */
@media (max-width: 480px) {
  .button-container h2 {
    font-size: 36px;
  }

  #buttonA,
  #buttonB {
    font-size: 13px;
    padding: 15px 20px;
  }
}

  </style>
</head>

<body>

  
  <div class="button-container">
    <h2>Mas kan sayang ade<br>
      Apakah ade sayang mas juga? ❤️</h2>

    <div class="button-area">
      <button id="buttonA">NGGA!!!</button>
      <button id="buttonB">SAYANG ❤️</button>
    </div>
  </div>

  
  <script>
  const buttonA = document.getElementById("buttonA");
const buttonB = document.getElementById("buttonB");
const buttonArea = document.querySelector(".button-area");

// Tombol A berpindah tempat
buttonA.addEventListener("click", function() {

  const maxX = buttonArea.clientWidth - buttonA.offsetWidth;
  const maxY = buttonArea.clientHeight - buttonA.offsetHeight;

  const randomX = Math.random() * maxX;
  const randomY = Math.random() * maxY;

  buttonA.style.left = randomX + "px";
  buttonA.style.top = randomY + "px";

});

// Tombol B membuka surprise.html
buttonB.addEventListener("click", function() {
  window.location.href = "surprise.html";
});
  </script>

</body>
</html>
