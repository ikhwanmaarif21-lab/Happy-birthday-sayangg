
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#300914">
<title>Message Inbox ❤️</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:30px 18px;min-height:100vh;background:#240811;color:#f6e7e7;font-family:Georgia,serif}
main{max-width:650px;margin:30px auto}
h1{text-align:center;font-weight:normal}
.subtitle{text-align:center;color:#d5aab4}
.message{padding:20px;margin:18px 0;background:#391421;border:1px solid #81505d;border-radius:13px;overflow-wrap:anywhere}
.date{font-size:12px;color:#d69ba9;margin-bottom:12px}
.content{font-size:17px;line-height:1.8;white-space:pre-wrap}
button,a{display:inline-block;padding:12px 20px;margin:8px 4px;border:1px solid #bd8291;border-radius:25px;background:transparent;color:#f6e7e7;text-decoration:none;cursor:pointer}
.actions{text-align:center}
#status{text-align:center;color:#e4b7c2}
</style>
</head>
<body>
<main>
<h1>Our Little Inbox ❤️</h1>
<p class="subtitle">Every message is special.</p>
<div class="actions">
 <button onclick="loadMessages()">Refresh Messages ↻</button>
 <a href="/surprise.html">Back to Website</a>
</div>
<p id="status">Loading messages...</p>
<div id="messages"></div>
</main>

<script>
async function loadMessages(){
 const container=document.getElementById("messages");
 const status=document.getElementById("status");
 status.textContent="Loading...";
 container.replaceChildren();

 try{
  const response=await fetch("/api/messages");
  const data=await response.json();

  if(!response.ok)throw new Error(data.error||"Failed");

  if(!data.messages.length){
   status.textContent="Belum ada pesan masuk ❤️";
   return;
  }

  status.textContent=data.messages.length+" pesan diterima ❤️";

  data.messages.forEach(item=>{
   const card=document.createElement("article");
   card.className="message";

   const date=document.createElement("div");
   date.className="date";
   date.textContent=item.created_at||"";

   const content=document.createElement("div");
   content.className="content";
   content.textContent=item.message;

   card.append(date,content);
   container.append(card);
  });
 }catch(error){
  status.textContent="Gagal mengambil pesan. Pastikan sudah login.";
 }
}
loadMessages();
</script>
</body>
</html>
